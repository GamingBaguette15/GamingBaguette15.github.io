<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101018">
  <meta name="robots" content="noindex">
  <title>Page not found — GamingBaguette15</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='10' fill='%23c5f36a'/%3E%3Ctext x='16' y='23' font-size='20' text-anchor='middle' fill='%23161b0f'%3E%E2%9C%B3%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="/fonts/fonts.css">
  <style>
    :root {
      color-scheme: dark;
      --bg: #101018;
      --panel: #181821;
      --text: #f5f3ef;
      --muted: #a3a1ad;
      --accent: #c5f36a;
      --line: rgba(255, 255, 255, .1);
      --mono: "DM Mono", monospace;
      --sans: "Space Grotesk", sans-serif;
    }
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      -webkit-font-smoothing: antialiased;
    }
    main { max-width: 560px; }
    .code { color: var(--accent); font-family: var(--mono); font-size: 12px; letter-spacing: .12em; text-transform: uppercase; }
    h1 { margin: 18px 0 14px; font-size: clamp(40px, 8vw, 64px); line-height: 1; letter-spacing: -.06em; }
    p { margin: 0; color: var(--muted); font-size: 15px; line-height: 1.75; }
    .actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 30px; }
    .button {
      display: inline-flex;
      min-height: 46px;
      align-items: center;
      padding: 0 18px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      color: var(--text);
      font-size: 13px;
      font-weight: 600;
      text-decoration: none;
    }
    .button-primary { border-color: var(--accent); background: var(--accent); color: #171b10; }
    .button:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }
  </style>
</head>
<body>
  <main>
    <p class="code">Error 404</p>
    <h1>Nothing here.</h1>
    <p>That page doesn't exist or it moved. The downloads and the README are on the home page.</p>
    <div class="actions">
      <a class="button button-primary" href="/#downloads">Go to downloads</a>
      <a class="button" href="/#readme">Read the README</a>
    </div>
  </main>
</body>
</html>
